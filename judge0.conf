################################################################################
# Judge0 Configuration for Xe-Recruiters
################################################################################

# ── Server ──
JUDGE0_TELEMETRY_ENABLE=false
ENABLE_WAIT_RESULT=true
ENABLE_BATCHED_SUBMISSIONS=true
MAX_SUBMISSION_BATCH_SIZE=20
ENABLE_CALLBACKS=true
ENABLE_ADDITIONAL_FILES=true

# ── Workers ──
INTERVAL=0.1
COUNT=4
MAX_QUEUE_SIZE=100

# ── Access ──
ALLOW_ORIGIN=*

# ── Authentication ──
AUTHN_HEADER=X-Judge0-Token
AUTHN_TOKEN=xe-judge0-secret-2024

# ── Authorization ──
AUTHZ_HEADER=X-Judge0-User
AUTHZ_TOKEN=xe-judge0-admin-2024

# ── Redis (Judge0-dedicated) ──
REDIS_HOST=judge0-redis
REDIS_PORT=6379
REDIS_PASSWORD=xe_judge0_redis_2024

# ── PostgreSQL (Judge0-dedicated) ──
POSTGRES_HOST=judge0-db
POSTGRES_PORT=5432
POSTGRES_DB=judge0
POSTGRES_USER=judge0
POSTGRES_PASSWORD=xe_judge0_db_2024

# ── Submission Limits ──
CPU_TIME_LIMIT=5
MAX_CPU_TIME_LIMIT=15
CPU_EXTRA_TIME=1
MAX_CPU_EXTRA_TIME=5
WALL_TIME_LIMIT=10
MAX_WALL_TIME_LIMIT=20
MEMORY_LIMIT=128000
MAX_MEMORY_LIMIT=512000
STACK_LIMIT=64000
MAX_STACK_LIMIT=128000
MAX_PROCESSES_AND_OR_THREADS=60
MAX_MAX_PROCESSES_AND_OR_THREADS=120
MAX_FILE_SIZE=1024
MAX_MAX_FILE_SIZE=4096
NUMBER_OF_RUNS=1
MAX_NUMBER_OF_RUNS=5
REDIRECT_STDERR_TO_STDOUT=false
ENABLE_NETWORK=false

# ── Rails ──
RAILS_ENV=production
RAILS_MAX_THREADS=4
RAILS_SERVER_PROCESSES=2
