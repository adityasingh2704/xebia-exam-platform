# Render Infrastructure-as-Code Blueprint for Xe-Recruiters Microservices
version: "1"

services:
  # ── API Gateway ──────────────────────────────────────────
  - type: web
    name: xe-api-gateway
    env: node
    plan: free
    buildCommand: npm install --include=dev && npx turbo run build --filter=@xe-recruiters/api-gateway...
    startCommand: node services/api-gateway/dist/main.js
    envVars:
      - key: NODE_VERSION
        value: "20.18.0"
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        value: xe-recruiters-jwt-secret-change-in-production-2024
      - key: AUTH_SERVICE_URL
        value: https://xe-auth-service.onrender.com
      - key: TENANT_SERVICE_URL
        value: https://xe-tenant-service.onrender.com
      - key: USER_SERVICE_URL
        value: https://xe-user-service.onrender.com
      - key: EXAM_SERVICE_URL
        value: https://xe-exam-service.onrender.com
      - key: QUESTION_SERVICE_URL
        value: https://xe-question-bank-service.onrender.com

  # ── Auth Service ─────────────────────────────────────────
  - type: web
    name: xe-auth-service
    env: node
    plan: free
    buildCommand: npm install --include=dev && npx prisma generate --schema=services/user-service/prisma/schema.prisma && npx prisma generate --schema=services/tenant-service/prisma/schema.prisma && npx turbo run build --filter=@xe-recruiters/auth-service...
    startCommand: node services/auth-service/dist/main.js
    envVars:
      - key: NODE_VERSION
        value: "20.18.0"
      - key: NODE_ENV
        value: production
      - key: AUTH_DATABASE_URL
        value: mongodb+srv://adityasinghasks_db_user:XERECRUIT123456@cluster0.79ua2y5.mongodb.net/xe_auth?retryWrites=true&w=majority&appName=Cluster0
      - key: USER_DATABASE_URL
        value: mongodb+srv://adityasinghasks_db_user:XERECRUIT123456@cluster0.79ua2y5.mongodb.net/xe_user?retryWrites=true&w=majority&appName=Cluster0
      - key: TENANT_DATABASE_URL
        value: mongodb+srv://adityasinghasks_db_user:XERECRUIT123456@cluster0.79ua2y5.mongodb.net/xe_tenant?retryWrites=true&w=majority&appName=Cluster0
      - key: JWT_SECRET
        value: xe-recruiters-jwt-secret-change-in-production-2024
      - key: JWT_REFRESH_SECRET
        value: xe-recruiters-refresh-secret-change-in-production-2024

  # ── Tenant Service ───────────────────────────────────────
  - type: web
    name: xe-tenant-service
    env: node
    plan: free
    buildCommand: npm install --include=dev && npx turbo run build --filter=@xe-recruiters/tenant-service...
    startCommand: node services/tenant-service/dist/main.js
    envVars:
      - key: NODE_VERSION
        value: "20.18.0"
      - key: NODE_ENV
        value: production
      - key: TENANT_DATABASE_URL
        value: mongodb+srv://adityasinghasks_db_user:XERECRUIT123456@cluster0.79ua2y5.mongodb.net/xe_tenant?retryWrites=true&w=majority&appName=Cluster0

  # ── User Service ─────────────────────────────────────────
  - type: web
    name: xe-user-service
    env: node
    plan: free
    buildCommand: npm install --include=dev && npx turbo run build --filter=@xe-recruiters/user-service...
    startCommand: node services/user-service/dist/main.js
    envVars:
      - key: NODE_VERSION
        value: "20.18.0"
      - key: NODE_ENV
        value: production
      - key: USER_DATABASE_URL
        value: mongodb+srv://adityasinghasks_db_user:XERECRUIT123456@cluster0.79ua2y5.mongodb.net/xe_user?retryWrites=true&w=majority&appName=Cluster0

  # ── Exam Service ─────────────────────────────────────────
  - type: web
    name: xe-exam-service
    env: node
    plan: free
    buildCommand: npm install --include=dev && npx turbo run build --filter=@xe-recruiters/exam-service...
    startCommand: node services/exam-service/dist/main.js
    envVars:
      - key: NODE_VERSION
        value: "20.18.0"
      - key: NODE_ENV
        value: production
      - key: EXAM_DATABASE_URL
        value: mongodb+srv://adityasinghasks_db_user:XERECRUIT123456@cluster0.79ua2y5.mongodb.net/xe_exam?retryWrites=true&w=majority&appName=Cluster0
      - key: JUDGE0_API_URL
        value: https://judge0-ce.p.rapidapi.com

  # ── Question Bank Service ────────────────────────────────
  - type: web
    name: xe-question-bank-service
    env: node
    plan: free
    buildCommand: npm install --include=dev && npx turbo run build --filter=@xe-recruiters/question-bank-service...
    startCommand: node services/question-bank-service/dist/main.js
    envVars:
      - key: NODE_VERSION
        value: "20.18.0"
      - key: NODE_ENV
        value: production
      - key: QUESTION_DATABASE_URL
        value: mongodb+srv://adityasinghasks_db_user:XERECRUIT123456@cluster0.79ua2y5.mongodb.net/xe_question?retryWrites=true&w=majority&appName=Cluster0
